<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline</title>
    <style>
        body {
            width: 250px;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .mode {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<h3>Proxy Switch</h3>

<!-- Regular Mode Toggle -->
<div class="mode">
    <label>Regular Mode</label>
    <label class="switch">
        <input type="checkbox" id="regularToggle">
        <span class="slider"></span>
    </label>
    <p id="regularStatus">Proxy is OFF</p>
</div>

<!-- Incognito Mode Toggle -->
<div class="mode">
    <label>Incognito Mode</label>
    <label class="switch">
        <input type="checkbox" id="incognitoToggle">
        <span class="slider"></span>
    </label>
    <p id="incognitoStatus">Proxy is OFF</p>
</div>

<script src="popup.js"></script>
</body>
</html>
